<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CrushOps · 追 crush 时你是怎样的人</title>
<style>
  :root{ --paper:#FEFDF8;--ink:#4A4D50;--line:#DFE3E2;--muted:#9FA2A6;--soft:#FCEFF4;--dot:#F8CCDB;--cta-bg:#F8CCDB;--cta-text:#4A4D50;--radius:14px;--opt-bg:#FFFFFF;--opt-shadow:0 3px 12px rgba(159,162,166,.10);--hover:#E7BFD0;--picked-border:#E7AFC6;--track:#DFE3E2;--fill:#F8CCDB;--cta-shadow:0 8px 22px rgba(248,204,219,.55);--bg-image:radial-gradient(circle at 50% 0%, rgba(248,204,219,.20), transparent 62%);--card:#FFFFFF }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);background-image:var(--bg-image);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  .view{display:none;min-height:100vh;padding:48px 24px;flex-direction:column;align-items:center;justify-content:flex-start}
  .view.active{display:flex;animation:viewIn .34s ease both}
  @keyframes viewIn{from{opacity:0}to{opacity:1}}
  .stage{width:100%;max-width:760px;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center}

  /* ---------- 封面 ---------- */
  .brand{font-family:Inter,"Helvetica Neue",Arial,sans-serif;
         font-size:clamp(44px,7.2vw,84px);font-weight:800;letter-spacing:-.045em;line-height:1}
  .rule{width:120px;height:1px;background:var(--line);flex:none}
  .rule.top{margin:56px 0 0}
  .ecg{display:block;width:100%;height:auto;margin:56px 0 0;color:var(--line)}
  .ecg circle{fill:var(--dot)}
  h1{font-size:clamp(36px,6vw,72px);line-height:1.36;letter-spacing:-.035em;
     font-weight:800;margin:44px 0 0;word-break:keep-all}
  .rule.bottom{margin:64px 0 48px}
  .cta{display:inline-flex;align-items:center;justify-content:space-between;gap:34px;
       background:var(--cta-bg);color:var(--cta-text);border:0;cursor:pointer;font-family:inherit;
       padding:18px 26px 18px 32px;border-radius:var(--radius);font-size:17px;font-weight:800;letter-spacing:.06em;
       box-shadow:var(--cta-shadow);transition:transform .18s ease,opacity .18s ease}
  .cta:hover{transform:translateY(-2px);opacity:.88}
  .cta:active{transform:translateY(0)}
  .cta svg{width:18px;height:18px;flex:none}
  .cta.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}

  /* ---------- 答题 ---------- */
  .quiz-box{width:100%;max-width:660px;margin:auto}
  .progress{position:relative;width:100%;height:2px;background:var(--track)}
  .progress .fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--fill);
                  transition:width .38s cubic-bezier(.22,.61,.36,1)}
  .progress .tick{position:absolute;top:-3px;width:1px;height:8px;background:var(--line)}
  .q-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px}
  .acts{display:flex;align-items:center;gap:clamp(10px,2.8vw,22px)}
  .acts i{font-style:normal;font-size:clamp(19px,3vw,24px);line-height:1;opacity:.3;filter:grayscale(1);
          transition:opacity .3s ease,filter .3s ease,transform .3s ease}
  .acts i.on{opacity:1;filter:none;transform:scale(1.18)}
  #pNum{font-family:Inter,Arial,sans-serif;font-size:12px;letter-spacing:.16em;color:var(--muted);
        font-weight:600;white-space:nowrap}
  .q-body{margin:clamp(48px,9vh,96px) 0 0;animation:rise .36s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .q-text{font-size:clamp(21px,3.2vw,29px);line-height:1.62;letter-spacing:-.01em;
          font-weight:800;word-break:break-word}
  .opts{margin-top:clamp(28px,5vh,48px);display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;
       background:var(--opt-bg);box-shadow:var(--opt-shadow);
       border:1px solid var(--line);border-radius:var(--radius);
       padding:16px 20px;min-height:62px;cursor:pointer;font-family:inherit;
       color:var(--ink);font-size:clamp(14px,1.8vw,16.5px);font-weight:600;line-height:1.55;
       animation:rise .36s ease both;transition:border-color .18s ease,background .18s ease,transform .18s ease}
  .opt:hover{border-color:var(--hover);transform:translateX(3px)}
  .opt .k{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;
          color:var(--muted);flex:none;min-width:14px;transition:color .18s ease}
  .opt.picked{border-color:var(--picked-border);background:var(--soft);transform:translateX(3px)}
  .opt.picked .k{color:var(--ink)}
  .q-foot{margin-top:clamp(28px,5vh,44px);display:flex;justify-content:flex-start}
  .back{background:none;border:0;cursor:pointer;font-family:inherit;font-size:12.5px;
        font-weight:600;letter-spacing:.04em;color:var(--muted);padding:8px 0;transition:color .18s ease}
  .back:hover{color:var(--ink)}
  .back:disabled{opacity:.3;cursor:default}

  /* ---------- 结果页 ---------- */
  .result-wrap{width:100%;max-width:640px;margin:auto;padding:8px 0 24px}
  .res-head{text-align:center;padding:18px 0 26px}
  .res-kicker{font-size:11px;letter-spacing:.22em;color:var(--muted);font-weight:700}
  .res-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-.035em;
            line-height:1.25;margin-top:14px}
  .res-sub{font-size:13px;color:var(--muted);margin-top:5px}
  .res-quote{font-size:16px;font-weight:800;margin-top:18px;padding:0 10px;line-height:1.6}
  .res-desc{font-size:14.5px;line-height:2.05;text-align:justify;text-indent:2em;
            border-top:1px solid var(--line);border-bottom:1px solid var(--line);
            padding:20px 2px;margin:0 0 22px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
         padding:20px 22px;margin:14px 0}
  .panel-h{font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:800;margin-bottom:12px}
  #radar{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
  .dominant{text-align:center;font-size:12.5px;color:var(--muted);margin-top:8px}
  .dominant b{color:var(--ink);font-weight:800}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
  .stat{background:var(--soft);border-radius:var(--radius);padding:18px;text-align:center}
  .stat-n{font-family:Inter,Arial,sans-serif;font-size:32px;font-weight:800;letter-spacing:-.03em}
  .stat-l{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.08em}
  #actChart{display:block;width:100%;height:auto}
  .partner-card{background:var(--soft);border-radius:var(--radius);padding:18px 20px;margin-top:12px}
  [hidden]{display:none!important}
  .partner-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;
         background:var(--soft);border:1px solid var(--line);border-radius:var(--radius);
         padding:18px 20px;font-family:inherit;font-size:14px;font-weight:800;color:var(--ink);
         cursor:pointer;transition:border-color .18s ease,transform .18s ease}
  .partner-toggle:hover{border-color:var(--hover);transform:translateY(-2px)}
  .partner-toggle span{color:var(--muted);font-size:18px;font-weight:600}
  .p-name{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .p-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .p-reason{font-size:13.5px;line-height:1.8;margin-top:12px;padding-top:12px;
            border-top:1px solid var(--line)}
  .p-note{font-size:11px;color:var(--muted);margin-top:10px;text-align:right}
  .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0}
  .tags span{font-size:12px;color:var(--ink);background:var(--card);
             border:1px solid var(--line);border-radius:99px;padding:5px 14px}
  .review{margin:16px 0;border:1px solid var(--line);border-radius:var(--radius);
          background:var(--card);padding:0 18px}
  .review summary{cursor:pointer;font-size:13px;font-weight:700;padding:15px 0;list-style:none}
  .review summary::-webkit-details-marker{display:none}
  .review summary::before{content:"＋ ";color:var(--muted)}
  .review[open] summary::before{content:"－ "}
  .review-list{padding:0 0 16px;font-size:12px;line-height:1.9;color:var(--muted);
               max-height:320px;overflow:auto}
  .review-list div{padding:7px 0;border-top:1px solid var(--line)}
  .review-list b{color:var(--ink);font-weight:700}
  .res-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:22px 0 0}
  .res-actions .cta{font-size:14px;padding:14px 20px;gap:14px}
  .res-foot{text-align:center;font-size:12px;color:var(--muted);margin:30px 0 16px}
  .restart{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
         gap:3px;min-width:210px;padding:12px 26px;border:1px solid var(--ink);
         border-radius:var(--radius);background:var(--card);color:var(--ink);
         font-family:inherit;cursor:pointer;transition:transform .18s ease}
  .restart:hover{transform:translateY(-2px)}
  .restart-main{font-size:15px;font-weight:800;letter-spacing:.04em}
  .restart-sub{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
  .share-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:10px;letter-spacing:.02em}
  .toast{text-align:center;font-size:12px;color:var(--muted);min-height:18px;margin-top:10px;opacity:0;transition:opacity .25s}
  .toast.on{opacity:1}

  @media (max-width:640px){
    .view{padding:36px 22px}
    .brand{font-size:clamp(40px,11vw,58px)}
    .rule.top{margin-top:40px}
    .ecg{margin-top:36px}
    h1{font-size:clamp(31px,8.6vw,46px);margin-top:32px;letter-spacing:-.025em}
    .rule.bottom{margin:48px 0 36px}
    .cta{width:100%;max-width:320px;justify-content:center;gap:24px;padding:17px 24px}
    .q-body{margin-top:52px}
    .opt{padding:14px 16px;min-height:58px;gap:12px}
    .q-foot{margin-top:30px}
    .panel{padding:16px 15px}
    .res-desc{font-size:14px;padding:16px 0}
    .res-actions{flex-direction:column;align-items:center}
    .res-actions .cta{width:100%;max-width:320px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 封面 -->
<section class="view active" id="cover">
  <div class="stage">
    <div class="brand">CrushOps</div>
    <div class="rule top"></div>
    <svg class="ecg" viewBox="0 0 720 150" fill="none" aria-hidden="true">
      <path d="M0 75 L170 75 L205 63 L235 108 L275 32 L320 90 L360 10 L400 90 L445 32 L485 108 L515 63 L550 75 L720 75"
            stroke="currentColor" stroke-width="4" stroke-linejoin="miter"/>
      <circle cx="360" cy="10" r="7"/>
    </svg>
    <h1>追 crush 时<br>你是怎样的人？</h1>
    <div class="rule bottom"></div>
    <button class="cta" id="startBtn" type="button">
      开始测试
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</section>

<!-- 答题 -->
<section class="view" id="quiz">
  <div class="quiz-box">
    <div class="progress" id="progress"><div class="fill" id="fill"></div></div>
    <div class="q-head"><div class="acts" id="acts"></div><span id="pNum">01 / 25</span></div>
    <div class="q-body" id="qBody">
      <p class="q-text" id="qText"></p>
      <div class="opts" id="opts"></div>
    </div>
    <div class="q-foot"><button class="back" id="backBtn" type="button">← 上一题</button></div>
  </div>
</section>

<!-- 结果页 -->
<section class="view" id="result">
  <div class="result-wrap">
    <div class="res-head">
      <div class="res-kicker">CRUSHOPS · 观测报告</div>
      <div class="res-name" id="rName"></div>
      <div class="res-sub" id="rSub"></div>
      <div class="res-quote" id="rQuote"></div>
    </div>
    <p class="res-desc" id="rDesc"></p>

    <div class="panel">
      <div class="panel-h">八维观测</div>
      <svg id="radar" viewBox="0 0 340 340" aria-label="八维雷达图"></svg>
      <div class="dominant" id="rDominant"></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-n" id="rBurn"></div><div class="stat-l">内耗指数 / 100</div></div>
      <div class="stat"><div class="stat-n" id="rAct"></div><div class="stat-l" id="rActLabel">最内耗的一幕</div></div>
    </div>

    <div class="panel">
      <div class="panel-h">五幕曲线 · 内耗走向</div>
      <svg id="actChart" viewBox="0 0 340 120" aria-label="五幕曲线"></svg>
    </div>

    <div class="panel">
      <div class="panel-h">配到的 CRUSH 类型</div>
      <button class="partner-toggle" id="partnerToggle" type="button">点开看 ta 是什么类型 <span>→</span></button>
      <div class="partner-card" id="partnerCard" hidden>
        <div class="p-name" id="rPartner"></div>
        <div class="p-sub" id="rPartnerSub"></div>
        <div class="p-reason" id="rReason"></div>
      </div>
    </div>

    <div class="res-actions">
      <button class="restart" id="restartBtn" type="button">
        <span class="restart-main">重新测试</span>
        <span class="restart-sub">（和自己复合）</span>
      </button>
    </div>
    <div class="res-actions">
      <button class="cta" id="shareBtn" type="button">保存分享图</button>
      <button class="cta ghost" id="linkBtn" type="button">复制结果链接</button>
    </div>
    <div class="share-hint">发给 crush，问 ta 敢不敢直视神</div>
    <div class="toast" id="toast"></div>
    <div class="res-foot">什么也没发生，我又度过了幸福的一天 (ᗒᗩᗕ)</div>
  </div>
</section>

<script>
const DIMS = ["主动性","直白度","投入度","自我保护","持久力","想象力","仪式感","理性止损"];

function pick(i,btn){
  if(locked)return;
  locked=true; answers[idx]=i;
  [...document.getElementById('opts').children].forEach(b=>b.classList.remove('picked'));
  btn.classList.add('picked');

    if(idx+1<TOTAL){idx++;render();}

/* ---------- 计分 ---------- */
function compute(){
  const s={}; DIMS.forEach(d=>s[d]=0);
  answers.forEach((a,i)=>{if(a!==null)QUIZ[i].options[a].dims.forEach(d=>s[d]++);});
  const norm={}; DIMS.forEach(d=>norm[d]=Math.round(s[d]/COVERAGE[d]*100));
  const vals=DIMS.map(d=>norm[d]);
  const mn=Math.min(...vals),mx=Math.max(...vals),span=Math.max(mx-mn,8);
  const disp={}; DIMS.forEach(d=>disp[d]=Math.round(42+(norm[d]-mn)/span*58));
  let top=DIMS[0]; DIMS.forEach(d=>{if(norm[d]>norm[top])top=d;});
  const ending=ENDINGS.find(e=>e.dim===top);
  const burn=Math.round(norm['自我保护']*0.4+norm['想象力']*0.35+norm['投入度']*0.25);
  const acts=[];
  for(let a=1;a<=5;a++){
    let hit=0;
    QUIZ.forEach((q,i)=>{
      if(q.act===a&&answers[i]!==null&&q.options[answers[i]].dims.some(d=>BURN_DIMS.includes(d)))hit++;
    });
    acts.push(Math.round(hit/5*100));
  }
  return {norm,disp,top,ending,burn,acts};
}

  g+='<polygon points="'+data+'" fill="'+C_DOT+'" fill-opacity="0.3" stroke="'+C_DOT+'" stroke-width="2"/>';
  DIMS.forEach((d,i)=>{
    const p=pt(i,R*Math.max(disp[d],3)/100);
    g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(d===top?4.5:2.5)+'" fill="'+(d===top?C_INK:C_DOT)+'"/>';
  });
  return g;
}
function actSVG(acts){
  const W=340,H=120,pad=30;
  const xs=acts.map((_,i)=>pad+i*(W-2*pad)/4);
  const ys=acts.map(v=>H-pad-(v/100)*(H-2*pad));
  let g='<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="'+C_LINE+'" stroke-width="1"/>';
  g+='<polyline points="'+xs.map((x,i)=>x.toFixed(1)+','+ys[i].toFixed(1)).join(' ')+'" fill="none" stroke="'+C_DOT+'" stroke-width="2.5" stroke-linejoin="round"/>';
  xs.forEach((x,i)=>{
    g+='<circle cx="'+x.toFixed(1)+'" cy="'+ys[i].toFixed(1)+'" r="3.5" fill="'+C_DOT+'"/>';
    g+='<text x="'+x.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="'+C_MUTED+'">'+ACT_CN[i]+'</text>';
  });
  return g;
}
function showResult(){
  const r=compute();
  document.getElementById('rName').textContent=r.ending.name;
  document.getElementById('rSub').textContent=r.ending.subtitle;
  document.getElementById('rQuote').textContent='「'+r.ending.quote+'」';
  document.getElementById('rDesc').textContent=r.ending.desc;
  document.getElementById('radar').innerHTML=radarSVG(r.disp,r.top);
  document.getElementById('rDominant').innerHTML='你的主导维度：<b>'+r.top+' '+r.disp[r.top]+'</b>';
  document.getElementById('rBurn').textContent=r.burn;
  let maxI=0; r.acts.forEach((v,i)=>{if(v>r.acts[maxI])maxI=i;});
  document.getElementById('rAct').textContent=ACT_CN[maxI];
  document.getElementById('actChart').innerHTML=actSVG(r.acts);
  const partner=ENDINGS.find(e=>e.name===r.ending.partner);
  document.getElementById('rPartner').textContent=r.ending.partner;
  document.getElementById('rPartnerSub').textContent=partner?partner.subtitle:'';
  document.getElementById('rReason').textContent=r.ending.partnerReason;
  document.getElementById('partnerCard').hidden=true;
  document.getElementById('partnerToggle').querySelector('span').textContent='→';
  show('result');
}

/* ---------- 结果链接 ---------- */
function encodeAns(){return answers.map(a=>a===null?'x':String(a)).join('');}
function decodeAns(str){answers=[...str].map(ch=>ch==='x'?null:Number(ch));}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2600);
}

/* ---------- 分享图 ---------- */
function wrapText(c,text,x,y,maxW,lh){
  let line='',yy=y;
  for(const ch of text){
    if(c.measureText(line+ch).width>maxW){c.fillText(line,x,yy);yy+=lh;line=ch;}
    else line+=ch;
  }
  c.fillText(line,x,yy); return yy;
}
function shareImage(){
  const r=compute();
  const cv=document.createElement('canvas'); cv.width=750; cv.height=1120;
  const c=cv.getContext('2d');
  c.fillStyle=C_PAPER; c.fillRect(0,0,750,1120);
  c.textAlign='left';
  c.fillStyle=C_MUTED; c.font='600 22px "PingFang SC",sans-serif';
  c.fillText('CRUSHOPS · 追 crush 时你是怎样的人',60,80);
  c.fillStyle=C_INK; c.font='800 76px "PingFang SC",sans-serif';
  c.fillText(r.ending.name,60,200);
  c.fillStyle=C_MUTED; c.font='400 24px "PingFang SC",sans-serif';
  c.fillText(r.ending.subtitle,60,244);
  c.fillStyle=C_INK; c.font='700 30px "PingFang SC",sans-serif';
  wrapText(c,'「'+r.ending.quote+'」',60,310,630,44);
  c.fillStyle=C_INK; c.font='400 26px "PingFang SC",sans-serif';
  wrapText(c,r.ending.desc,60,400,630,44);
  // 简化雷达
  const cx=375,cy=680,R=150;
  const pt=(i,rr)=>{const a=-Math.PI/2+i*Math.PI/4;return[cx+Math.cos(a)*rr,cy+Math.sin(a)*rr];};
  c.strokeStyle=C_LINE; c.lineWidth=1.5;
  [0.33,0.66,1].forEach(k=>{c.beginPath();DIMS.forEach((_,i)=>{const p=pt(i,R*k);i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]);});c.closePath();c.stroke();});
  DIMS.forEach((d,i)=>{const p=pt(i,R);c.beginPath();c.moveTo(cx,cy);c.lineTo(p[0],p[1]);c.stroke();
    const l=pt(i,R+30);c.fillStyle=C_MUTED;c.font='400 19px "PingFang SC",sans-serif';c.textAlign='center';c.fillText(d,l[0],l[1]+6);});
  c.beginPath();DIMS.forEach((d,i)=>{const p=pt(i,R*Math.max(r.disp[d],3)/100);i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]);});
  c.closePath();c.fillStyle=C_DOT;c.globalAlpha=.3;c.fill();c.globalAlpha=1;c.strokeStyle=C_DOT;c.lineWidth=3;c.stroke();
  c.textAlign='left';c.fillStyle=C_MUTED;c.font='400 22px "PingFang SC",sans-serif';
  c.fillText('主导维度 '+r.top+' '+r.disp[r.top]+'　·　内耗指数 '+r.burn,60,920);
  c.fillText('配到 crush：'+r.ending.partner,60,962);
  c.fillStyle=C_INK;c.font='600 24px "PingFang SC",sans-serif';
  c.fillText('什么也没发生，我又度过了幸福的一天',60,1040);
  const a=document.createElement('a');a.download='CrushOps_'+r.ending.name+'.png';a.href=cv.toDataURL('image/png');a.click();
  toast('分享图已保存');
}

/* ---------- 事件 ---------- */
document.getElementById('backBtn').addEventListener('click',()=>{if(idx>0&&!locked){idx--;render();}});
document.getElementById('startBtn').addEventListener('click',()=>{idx=0;answers.fill(null);location.hash='';show('quiz');render();});
document.getElementById('restartBtn').addEventListener('click',()=>{idx=0;answers.fill(null);location.hash='';show('cover');});
document.getElementById('partnerToggle').addEventListener('click',()=>{
  const card=document.getElementById('partnerCard');
  card.hidden=!card.hidden;
  document.getElementById('partnerToggle').querySelector('span').textContent=card.hidden?'→':'－';
});
document.getElementById('shareBtn').addEventListener('click',shareImage);
document.getElementById('linkBtn').addEventListener('click',()=>{
  const url=location.href.split('#')[0]+'#r='+encodeAns();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>toast('结果链接已复制')).catch(()=>prompt('复制这个链接：',url));
  }else prompt('复制这个链接：',url);
});
document.addEventListener('keydown',e=>{
  if(!views.quiz.classList.contains('active'))return;
  const map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3,'A':0,'B':1,'C':2,'D':3};
  if(e.key in map&&!locked){const b=document.getElementById('opts').children[map[e.key]];if(b)pick(map[e.key],b);}
  if((e.key==='ArrowLeft'||e.key==='Backspace')&&idx>0&&!locked){idx--;render();}
});
// 打开分享链接时直接看结果
(function(){const m=location.hash.match(/r=([0-3x]{25})/);if(m){decodeAns(m[1]);showResult();}})();
